<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8f6">
    <title>Mirza Brothers | MedSupply distribution workspace</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" aria-label="MedSupply home">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span class="brand-copy"><strong>Mirza Brothers</strong><small>MedSupply distribution</small></span>
        </a>
        <div class="nav-label">WORKSPACE</div>
        <nav class="nav-list" id="navigation">
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◫</span>Overview</button>
          <button class="nav-item" data-view="inventory"><span class="nav-icon">▤</span>Inventory</button>
          <button class="nav-item" data-view="batches"><span class="nav-icon">▦</span>Batch tracking</button>
          <button class="nav-item" data-view="orders"><span class="nav-icon">↗</span>Orders</button>
          <button class="nav-item" data-view="returns"><span class="nav-icon">↺</span>Returns</button>
          <button class="nav-item" data-view="suppliers"><span class="nav-icon">♧</span>Suppliers</button>
          <button class="nav-item" data-view="reports"><span class="nav-icon">▥</span>Reports</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="storage-note"><span class="status-dot"></span><span><strong>Local workspace</strong><small>Data saved in this browser</small></span></div>
          <button class="nav-item" data-action="reset"><span class="nav-icon">↺</span>Reset sample data</button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-mark">M</span><strong>Mirza Brothers</strong></div>
          <div class="breadcrumbs"><span>Workspace</span><span class="crumb-separator">/</span><strong id="current-section">Overview</strong></div>
          <div class="topbar-right">
            <span class="today-label" id="today-label"></span>
            <span class="avatar" aria-label="Mirza Brothers">MB</span>
          </div>
        </header>
        <div class="content" id="app-content" tabindex="-1"></div>
        <footer class="footer-note">
          <div class="company-contact" aria-label="Company contact information">
            <strong>Mirza Brothers</strong>
            <span>Main GT Road, Dina</span>
            <a href="tel:03455675307">03455675307</a>
          </div>
          <span>For inventory and distribution operations only. Verify local regulatory and record-keeping requirements before use.</span>
        </footer>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="print-root" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
